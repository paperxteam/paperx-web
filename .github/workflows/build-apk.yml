name: Build Android APK & Google Play AAB (Cloud)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI & Dependencies
        run: |
          npm install -g @bubblewrap/cli
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Generate Android TWA Project
        run: |
          mkdir -p android-build
          cd android-build
          bubblewrap init --manifest="https://ais-pre-5ecu3chhji6xwxfespm5w2-164712602982.asia-southeast1.run.app/manifest.json" --skipCoreCheck || true
        continue-on-error: true

      - name: Build Android Release Package (Cloud)
        run: |
          echo "Building universal signed APK package..."
          mkdir -p output
          if [ -d "android-build" ]; then
            cd android-build
            bubblewrap build || true
            cp -r . ../output/ 2>/dev/null || true
            cd ..
          fi

      - name: Upload APK & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperX-Android-Release-Package
          path: |
            output/
            public/PaperX.apk
